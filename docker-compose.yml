# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================

services:
  stock-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis
    restart: unless-stopped

    # 加载 .env 文件中的环境变量
    env_file:
      - .env

    # 命令行参数：仅 API + Web 服务模式
    command: ["--serve-only", "--port", "8000"]

    # 挂载卷（保留数据）
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports

    # 端口映射
    ports:
      - "8000:8000"

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
