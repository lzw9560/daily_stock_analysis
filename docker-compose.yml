# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================

version: '3.8'

services:
  stock-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis
    restart: unless-stopped
    
    # 环境变量配置
    environment:
      - STOCK_LIST=${STOCK_LIST:-002283}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AIHUBMIX_KEY=${AIHUBMIX_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LITELLM_MODEL=${LITELLM_MODEL:-deepseek-chat}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - REPORT_TYPE=${REPORT_TYPE:-simple}
      - REPORT_LANGUAGE=${REPORT_LANGUAGE:-zh}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_WORKERS=${MAX_WORKERS:-3}
      - RUN_IMMEDIATELY=${RUN_IMMEDIATELY:-true}
      - MARKET_REVIEW_ENABLED=${MARKET_REVIEW_ENABLED:-true}
    
    # 挂载卷（保留数据）
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./data/stock_analysis.db:/app/data/stock_analysis.db
    
    # 端口映射
    ports:
      - "8000:8000"
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebUI 服务（可选）
  stock-analysis-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis-web
    command: python webui.py
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
