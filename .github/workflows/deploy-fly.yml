name: Deploy to Fly.io

# develop 分支每次 push 自动部署到 Fly.io
on:
  push:
    branches: [develop]
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to Fly.io
    runs-on: ubuntu-latest
    # 只在 lzw9560/daily_stock_analysis 仓库运行（避免 fork 触发）
    if: github.repository == 'lzw9560/daily_stock_analysis'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🪰 Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy
        run: flyctl deploy --remote-only --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: ✅ Verify deployment
        run: |
          sleep 10
          STATUS=$(flyctl status --json 2>/dev/null || echo '{}')
          echo "### 🚀 Fly.io 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- App: \`daily-stock-analysis\`" >> $GITHUB_STEP_SUMMARY
          echo "- Region: \`nrt\` (Tokyo)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://daily-stock-analysis.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 健康检查: https://daily-stock-analysis.fly.dev/api/health" >> $GITHUB_STEP_SUMMARY
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
