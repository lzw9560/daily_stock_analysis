services:
  - type: web
    name: daily-stock-analysis
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: ./
    dockerCommand: --serve-only --port $PORT --host 0.0.0.0
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_DIR
        value: /app/logs
      - key: DATABASE_PATH
        value: /app/data/stock_analysis.db
      - key: USE_PROXY
        value: "false"
