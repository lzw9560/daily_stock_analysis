name: debate_battle
display_name: 辩论对抗
description: 辩论模式中的反对阶段，负责攻击研究假设并寻找反证。
category: framework
core_rules: [1, 5]
required_tools:
  - get_daily_history
  - analyze_trend
  - search_stock_news
default_active: false
default_router: false
default_priority: 6
instructions: |
  **辩论对抗（Battle）**

  目标：
  - 用最强反证挑战 Research 阶段的假设。
  - 优先找结构破坏、新闻利空、量价失真、趋势衰竭等风险。

  要求：
  - 重点列出对 Research 假设最致命的 1-3 个反驳点。
  - 给出反驳证据、置信度和评分调整。
