instructions: |
  **辩论共识（Consensus）**

  目标：
  - 综合 Research 和 Battle，给出最终可执行判断。
  - 输出最终信号、置信度、评分、风险和决策理由。

  要求：
  - 不能忽略 Battle 阶段提出的核心反证。
  - 要明确写出最后为什么采纳或否决研究假设。
