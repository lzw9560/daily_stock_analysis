; ============================================================
; Supervisor 配置文件 - Daily Stock Analysis
; 用于进程守护和崩溃重启
; ============================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dsa-main]
command=python main.py --serve
directory=/Users/lizhiwei/project/code/stock/daily-stock-analysis/daily_stock_analysis
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/tmp/lsa_stdout.log
stderr_logfile=/tmp/lsa_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:dsa-web-dev]
command=npm run dev --prefix apps/dsa-web
directory=/Users/lizhiwei/project/code/stock/daily-stock-analysis/daily_stock_analysis
autostart=false
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/tmp/lsa_web_stdout.log
stderr_logfile=/tmp/lsa_web_stderr.log
