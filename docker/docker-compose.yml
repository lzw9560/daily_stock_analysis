# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
#
# 使用方式:
#   定时分析模式:  docker compose -f docker/docker-compose.yml up -d analyzer
#   API 服务模式:  docker compose -f docker/docker-compose.yml up -d server
#   同时启动:      docker compose -f docker/docker-compose.yml up -d
#   重建并启动:    docker compose -f docker/docker-compose.yml up -d --build
#   查看日志:      docker compose -f docker/docker-compose.yml logs -f
#
# ===================================

x-common: &common
  build:
    context: ../..
    dockerfile: daily_stock_analysis/docker/Dockerfile
  restart: unless-stopped

  # 从 .env 加载环境变量。注意：不要将 .env 作为单文件 volume 挂载到 /app/.env，
  # Docker mount point 会阻止 os.replace 原子更新。
  env_file:
    - ../.env

  # 数据持久化
  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # LongBridge OAuth token 持久化（entrypoint 会修复容器内权限）
    # 使用前需在宿主机创建目录：mkdir -p ./longbridge_tokens
    - ../longbridge_tokens:/home/dsa/.longbridge
    # 如需覆盖前端静态资源，可取消注释：
    # - ../static:/app/static:ro

  # DNS 配置（解决容器内 data.eastmoney.com 等域名解析失败的问题）
  # 优先使用国内 DNS，再回退到 Google DNS
  dns:
    - 114.114.114.114
    - 223.5.5.5
    - 8.8.8.8
  dns_search: []

  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0
    - WEBUI_PORT=8000
    - API_PORT=8000
    - LITELLM_LOCAL_COST_MAP=true

  # 日志轮转（防止日志占满磁盘）
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

  # 资源限制
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

services:
  # ─── 定时分析模式（按 schedule 持续运行）───
  analyzer:
    <<: *common
    container_name: stock-analyzer
    command: ["python", "main.py", "--schedule"]

  # ─── FastAPI 服务模式（API + Web UI）───
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
